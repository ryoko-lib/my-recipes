<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>おうちレシピ帳</title>
<style>
:root{
  --red:#c0392b;--red-l:#fde8e8;
  --green:#27ae60;--blue:#2980b9;--blue-l:#e8f0fd;
  --purple:#8e44ad;--orange:#e67e22;
  --bg:#faf8f5;--white:#fff;--border:#ede8e0;
  --text:#2c2c2c;--muted:#999;--nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;}

header{background:var(--white);border-bottom:2px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;}
.logo-text{font-weight:800;font-size:17px;color:var(--red);letter-spacing:.04em;}

nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1.5px solid var(--border);display:flex;z-index:100;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);}
nav.bottom button{flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:#bbb;font-family:inherit;}
nav.bottom button.active{color:var(--red);}
nav.bottom button .icon{font-size:22px;line-height:1;}

.section{display:none;}.section.active{display:block;}
main{max-width:600px;margin:0 auto;padding:16px 12px;}
.section-title{font-weight:800;font-size:17px;margin-bottom:14px;}

/* Filter */
.filter-panel{background:var(--white);border-radius:14px;border:1.5px solid var(--border);padding:14px 14px 10px;margin-bottom:14px;}
.filter-row{margin-bottom:10px;}
.filter-label{font-size:11px;font-weight:700;color:#aaa;margin-bottom:5px;display:block;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{padding:5px 12px;border:1.5px solid #ddd;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--white);color:#666;white-space:nowrap;}
.chip.on{color:var(--white);border-color:transparent;}
.search-input{width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;background:var(--white);outline:none;font-family:inherit;}
.filter-clear{font-size:12px;color:#aaa;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;margin-top:4px;}

/* Recipe list */
.recipe-list{display:flex;flex-direction:column;gap:10px;}
.recipe-card{background:var(--white);border-radius:12px;padding:14px 16px;border:1.5px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer;}
.recipe-card:active{opacity:.8;}
.recipe-info{flex:1;min-width:0;}
.recipe-top{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
.cat-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;color:var(--white);white-space:nowrap;}
.tool-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:#f0ebe3;color:#888;white-space:nowrap;}
.recipe-name{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;margin-bottom:3px;}
.recipe-meta{font-size:12px;color:var(--muted);}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.memo-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#fff8e1;color:#b7860a;font-weight:600;}
.recipe-actions{display:flex;gap:8px;flex-shrink:0;}
.recipe-actions button{background:none;border:none;font-size:18px;cursor:pointer;padding:4px;}
.empty-state{color:#bbb;text-align:center;margin-top:60px;line-height:1.8;font-size:15px;}

.fab{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));right:16px;width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(192,57,43,.4);z-index:99;line-height:1;font-family:inherit;}
.fab.hidden{display:none!important;}

/* Weekly */
.day-block{background:var(--white);border-radius:14px;border:1.5px solid var(--border);margin-bottom:12px;overflow:hidden;}
.day-header{background:#fdf3f3;padding:10px 16px;font-weight:800;font-size:15px;color:var(--red);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.day-body{padding:12px 16px;}
.day-empty{font-size:13px;color:#ccc;padding:12px 16px;}
/* dish rows inside day */
.dish-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.dish-row:last-child{margin-bottom:0;}
.dish-role{font-size:10px;font-weight:700;width:36px;flex-shrink:0;color:#aaa;}
.dish-name-tag{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;}
.dish-主菜{background:var(--red-l);color:var(--red);}
.dish-汁物{background:var(--blue-l);color:var(--blue);}
.dish-副菜{background:#e8fdef;color:var(--green);}
.dish-デザート{background:#f3e8fd;color:var(--purple);}
.day-btns{display:flex;gap:6px;flex-shrink:0;}
.btn-set{padding:5px 12px;font-size:12px;font-weight:700;border:1.5px solid var(--red);border-radius:8px;color:var(--red);background:var(--white);cursor:pointer;font-family:inherit;}
.btn-clear{padding:5px 8px;font-size:12px;border:1.5px solid #ddd;border-radius:8px;color:#aaa;background:var(--white);cursor:pointer;font-family:inherit;}

/* Backup */
.backup-box{background:var(--white);border-radius:14px;border:1.5px solid var(--border);padding:16px;margin-top:20px;}
.backup-title{font-size:13px;font-weight:700;color:#888;margin-bottom:12px;}
.backup-btns{display:flex;gap:10px;}
.btn-backup{flex:1;padding:12px;border:1.5px solid var(--red);border-radius:10px;background:var(--white);color:var(--red);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
.btn-restore{flex:1;padding:12px;border:none;border-radius:10px;background:var(--red);color:var(--white);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
#restore-input{display:none;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--white);border-radius:20px 20px 0 0;padding:24px 20px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:600px;max-height:92vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-title{font-weight:800;font-size:18px;}
.modal-close{background:none;border:none;font-size:26px;color:#bbb;cursor:pointer;line-height:1;padding:0 4px;}

/* Form */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:#888;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid #e0d8d0;border-radius:10px;font-size:16px;background:#faf8f5;outline:none;font-family:inherit;appearance:none;-webkit-appearance:none;}
.field textarea{resize:vertical;}
.field-row{display:flex;gap:10px;}.field-row .field{flex:1;}
.chip-field{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.chip-field .chip{font-size:13px;padding:7px 14px;}
.chip-field .chip.on{background:var(--red);color:#fff;}
.modal-footer{display:flex;gap:10px;margin-top:20px;}
.btn-cancel{flex:1;padding:14px;border:1.5px solid #ddd;border-radius:10px;background:var(--white);font-weight:700;color:#888;font-size:15px;cursor:pointer;font-family:inherit;}
.btn-save{flex:2;padding:14px;border:none;border-radius:10px;background:var(--red);color:var(--white);font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;}

/* Detail */
.detail-header-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.detail-badge{font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;color:var(--white);}
.detail-tool{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:#f0ebe3;color:#888;}
.detail-title{font-weight:800;font-size:22px;margin-bottom:6px;}
.detail-meta{font-size:13px;color:var(--muted);margin-bottom:10px;}
.detail-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px;}
.detail-section{font-weight:700;font-size:13px;color:var(--red);margin-bottom:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}
.detail-ul{padding-left:18px;}
.detail-ul li{font-size:15px;margin-bottom:6px;}
.step-item{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start;}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.step-text{font-size:15px;line-height:1.65;flex:1;}
.detail-memo-box{background:#fff8e1;border-radius:8px;padding:10px 14px;font-size:13px;color:#b7860a;font-weight:600;}

/* Picker modal */
.picker-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.picker-tab{padding:7px 16px;border:1.5px solid #ddd;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;background:var(--white);color:#888;white-space:nowrap;font-family:inherit;}
.picker-tab.active{background:var(--red);border-color:var(--red);color:#fff;}
.picker-tab.has-val{border-color:var(--red);color:var(--red);}
.picker-tab.has-val.active{background:var(--red);color:#fff;}
.meal-filter-mini{background:#faf8f5;border-radius:12px;padding:12px;margin-bottom:10px;}
.meal-search{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:16px;background:var(--white);outline:none;font-family:inherit;margin-bottom:8px;}
.meal-recipe-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;padding-right:2px;}
.meal-recipe-item{padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;display:flex;align-items:center;gap:8px;}
.meal-recipe-item.selected{border-color:var(--red);background:var(--red-l);}
.meal-recipe-item:active{opacity:.8;}
.meal-item-name{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meal-item-meta{font-size:11px;color:#aaa;flex-shrink:0;}
.meal-item-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
.picker-none-btn{padding:10px 14px;border-radius:10px;border:1.5px dashed #ddd;background:var(--white);cursor:pointer;text-align:center;font-size:13px;color:#aaa;font-family:inherit;width:100%;margin-bottom:6px;}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<header>
  <span style="font-size:22px">🍳</span>
  <span class="logo-text">おうちレシピ帳</span>
</header>

<main>
  <!-- レシピ -->
  <div class="section active" id="sec-recipes">
    <div class="filter-panel">
      <div class="filter-row">
        <input class="search-input" id="q-text" placeholder="料理名・食材・調味料で検索…" oninput="renderRecipes()">
      </div>
      <div class="filter-row">
        <span class="filter-label">カテゴリー</span>
        <div class="chips" id="chips-cat"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">調理器具</span>
        <div class="chips" id="chips-tool"></div>
      </div>
      <div class="filter-row" style="margin-bottom:2px">
        <span class="filter-label">タグ</span>
        <div class="chips" id="chips-tag"></div>
      </div>
      <button class="filter-clear" onclick="clearFilters()">絞り込みをリセット</button>
    </div>
    <div class="recipe-list" id="recipe-list"></div>
    <div class="backup-box">
      <div class="backup-title">📂 レシピのバックアップ</div>
      <div id="backup-info" style="font-size:12px;color:#888;margin-bottom:10px;"></div>
      <div class="backup-btns">
        <button class="btn-backup" onclick="exportRecipes()">書き出し（保存）</button>
        <button class="btn-restore" onclick="document.getElementById('restore-input').click()">読み込み（復元）</button>
      </div>
      <input type="file" id="restore-input" accept=".json" onchange="importRecipes(event)">
      <div style="font-size:11px;color:#aaa;margin-top:10px;line-height:1.6;">
        💡 書き出し先に <b>iCloud Drive</b> を選ぶと、iPhone/iPad/Macで共有できます。<br>
        ファイル名は <code style="background:#f5f0e8;padding:1px 4px;border-radius:3px;">recipes.json</code> 固定です。
      </div>
    </div>
  </div>

  <!-- 献立 -->
  <div class="section" id="sec-weekly">
    <div class="section-title">週間献立（夜）</div>
    <div id="weekly-list"></div>
  </div>
</main>

<button class="fab" id="fab-btn" onclick="openRecipeForm()">＋</button>

<nav class="bottom">
  <button class="active" onclick="switchTab('recipes')" id="nav-recipes"><span class="icon">🍳</span>レシピ</button>
  <button onclick="switchTab('weekly')" id="nav-weekly"><span class="icon">📅</span>献立</button>
</nav>

<!-- 詳細モーダル -->
<div class="modal-overlay" id="modal-detail" onclick="closeModal('modal-detail')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-header" style="margin-bottom:6px">
      <div></div>
      <button class="modal-close" onclick="closeModal('modal-detail')">×</button>
    </div>
    <div class="detail-header-badges" id="detail-badges"></div>
    <div class="detail-title" id="detail-name"></div>
    <div class="detail-meta" id="detail-meta"></div>
    <div class="detail-tags" id="detail-tags"></div>
    <div class="detail-section" style="border-top:none;padding-top:0;margin-top:8px">材料</div>
    <ul class="detail-ul" id="detail-ingredients"></ul>
    <div id="detail-seasonings-wrap">
      <div class="detail-section">調味料</div>
      <ul class="detail-ul" id="detail-seasonings"></ul>
    </div>
    <div id="detail-steps-wrap">
      <div class="detail-section">作り方</div>
      <div id="detail-steps"></div>
    </div>
    <div id="detail-memo-wrap">
      <div class="detail-section">メモ</div>
      <div class="detail-memo-box" id="detail-memo"></div>
    </div>
    <div style="height:4px"></div>
  </div>
</div>

<!-- 追加・編集モーダル -->
<div class="modal-overlay" id="modal-form" onclick="closeModal('modal-form')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="form-title">レシピを追加</span>
      <button class="modal-close" onclick="closeModal('modal-form')">×</button>
    </div>
    <div class="field">
      <label>料理名</label>
      <input type="text" id="f-name" placeholder="例：肉じゃが">
    </div>
    <div class="field">
      <label>カテゴリー</label>
      <div class="chip-field" id="f-cat-chips"></div>
    </div>
    <div class="field">
      <label>調理器具</label>
      <div class="chip-field" id="f-tool-chips"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>調理時間（分）</label><input type="number" id="f-time" placeholder="30"></div>
      <div class="field"><label>人数</label><input type="number" id="f-servings" placeholder="2" value="2"></div>
    </div>
    <div class="field">
      <label>食材（1行1つ）</label>
      <textarea id="f-ingredients" rows="4" placeholder="じゃがいも 3個&#10;牛肉 200g"></textarea>
    </div>
    <div class="field">
      <label>調味料（1行1つ）</label>
      <textarea id="f-seasonings" rows="3" placeholder="醤油 大さじ2&#10;みりん 大さじ1"></textarea>
    </div>
    <div class="field">
      <label>作り方（1行1ステップ）</label>
      <textarea id="f-steps" rows="5" placeholder="食材を一口大に切る&#10;油を熱してにんにくを炒める"></textarea>
    </div>
    <div class="field">
      <label>タグ（スペース区切り　例：kids💛　お弁当　簡単）</label>
      <input type="text" id="f-tags" placeholder="kids💛 お弁当 簡単">
    </div>
    <div class="field">
      <label>メモ</label>
      <input type="text" id="f-memo" placeholder="自由にメモ">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modal-form')">キャンセル</button>
      <button class="btn-save" onclick="saveRecipe()">保存する</button>
    </div>
  </div>
</div>

<!-- 確認モーダル -->
<div class="modal-overlay" id="modal-confirm" onclick="closeModal('modal-confirm')">
  <div class="modal-sheet" onclick="event.stopPropagation()" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title" id="confirm-title">確認</span>
      <button class="modal-close" onclick="closeModal('modal-confirm')">×</button>
    </div>
    <div id="confirm-body" style="font-size:14px;line-height:1.7;color:#555"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modal-confirm')">キャンセル</button>
      <button class="btn-save" id="confirm-ok-btn">続ける</button>
    </div>
  </div>
</div>

<!-- 献立ピッカーモーダル -->
<div class="modal-overlay" id="modal-picker" onclick="closeModal('modal-picker')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-header" style="margin-bottom:10px">
      <span class="modal-title" id="picker-title"></span>
      <button class="modal-close" onclick="closeModal('modal-picker')">×</button>
    </div>
    <!-- 品目タブ -->
    <div class="picker-tabs" id="picker-tabs"></div>
    <!-- フィルター -->
    <div class="meal-filter-mini">
      <input class="meal-search" id="picker-q" placeholder="料理名・食材・調味料で検索…" oninput="renderPicker()">
      <span class="filter-label" style="margin-bottom:5px;display:block">カテゴリー</span>
      <div class="chips" id="picker-chips-cat" style="margin-bottom:8px"></div>
      <span class="filter-label" style="margin-bottom:5px;display:block">調理器具</span>
      <div class="chips" id="picker-chips-tool"></div>
    </div>
    <button class="picker-none-btn" onclick="clearCurrentSlot()">✕ この品目をクリア</button>
    <div class="meal-recipe-list" id="picker-list"></div>
    <div class="modal-footer" style="margin-top:14px">
      <button class="btn-cancel" onclick="closeModal('modal-picker')">閉じる</button>
      <button class="btn-save" onclick="closeModal('modal-picker')">決定</button>
    </div>
  </div>
</div>

<script>
// ══ 定数 ══
const DAYS = ["月","火","水","木","金","土","日"];
const CATEGORIES = ["主菜","副菜","汁物","デザート","その他"];
const TOOLS = ["フライパン","レンジ","せいろ","カットのみ","その他"];
const CAT_COLOR = {主菜:"#c0392b",副菜:"#27ae60",汁物:"#2980b9",デザート:"#8e44ad",その他:"#7f8c8d"};
const TOOL_COLOR = {フライパン:"#e67e22",レンジ:"#2980b9",せいろ:"#27ae60",カットのみ:"#8e44ad",その他:"#7f8c8d"};
const TOOL_ICON = {フライパン:"🍳",レンジ:"📡",せいろ:"🫕",カットのみ:"🔪",その他:"🥄"};

// 献立の5スロット定義
const SLOTS = [
  {key:"主菜",  label:"主菜",   max:1, catHint:["主菜"]},
  {key:"汁物",  label:"汁物",   max:1, catHint:["汁物"]},
  {key:"副菜1", label:"副菜①", max:1, catHint:["副菜","その他"]},
  {key:"副菜2", label:"副菜②", max:1, catHint:["副菜","その他"]},
  {key:"デザート",label:"デザート",max:1,catHint:["デザート","その他"]},
];

// 空献立
function emptyMeal(){
  const o={};SLOTS.forEach(s=>o[s.key]=null);return o;
}

const INIT_RECIPES = [
  {id:1,name:"肉じゃが",category:"主菜",tool:"フライパン",time:30,servings:4,
   ingredients:["じゃがいも 3個","牛肉 200g","玉ねぎ 1個","にんじん 1本"],
   seasonings:["醤油 大さじ3","砂糖 大さじ2","みりん 大さじ2","だし 400ml"],
   steps:["食材を一口大に切る","油を熱して牛肉を炒める","野菜を加えて炒める","だしと調味料を入れて15分煮込む"],
   tags:["kids💛"],memo:"ほっこり定番おかず"},
  {id:2,name:"味噌汁",category:"汁物",tool:"フライパン",time:10,servings:2,

// ストレージのフォールバック付きヘルパー
// レシピ: localStorageで永久保存
// 献立: sessionStorageで都度上書き（ブラウザを閉じるとリセット）
const _memStore = {};
function storageGet(k, useSession){
  try{
    const store = useSession ? sessionStorage : localStorage;
    return store.getItem(k);
  }catch{
    return _memStore[k] || null;
  }
}
function storageSet(k, v, useSession){
  try{
    const store = useSession ? sessionStorage : localStorage;
    store.setItem(k, v);
  }catch{
    _memStore[k] = v;
  }
}
function loadRecipes(d){
  try{const v=storageGet("r_v4",false);return v?JSON.parse(v):d;}catch{return d;}
}
function loadMeals(){
  try{const v=storageGet("m_v5",true);return v?JSON.parse(v):null;}catch{return null;}
}
function persist(k,v){
  // m_v5は献立 → sessionStorage、r_v4はレシピ → localStorage
  const useSession = (k==='m_v5');
  try{storageSet(k, JSON.stringify(v), useSession);}catch{}
}

let recipes = loadRecipes(INIT_RECIPES);

// meals: { "月": { 主菜: id|null, 汁物: id|null, 副菜1: id|null, 副菜2: id|null, デザート: id|null }, ... }
let meals = (() => {
  const saved = loadMeals();
  const base = {};
  DAYS.forEach(d => base[d] = emptyMeal());
  if(!saved) return base;
  DAYS.forEach(d => {
    if(saved[d] && typeof saved[d] === 'object' && !Array.isArray(saved[d])){
      base[d] = {...emptyMeal(), ...saved[d]};
    }
  });
  return base;
})();

function allTags(){const s=new Set();recipes.forEach(r=>(r.tags||[]).forEach(t=>s.add(t)));return[...s];}
function getFiltered(q,cat,tool,tag){
  const lq=(q||'').toLowerCase();
  return recipes.filter(r=>{
    if(cat && r.category!==cat) return false;
    if(tool && r.tool!==tool) return false;
    if(tag && !(r.tags||[]).includes(tag)) return false;
    if(lq){
      const h=[r.name,...(r.ingredients||[]),...(r.seasonings||[])].join(' ').toLowerCase();
      if(!h.includes(lq)) return false;
    }
    return true;
  });
}
function mkChip(label,val,active,col,fn){
  const esc=val.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `<button class="chip${active?' on':''}" style="${active?'background:'+col+';border-color:'+col+';':''}" onclick="${fn}('${esc}')">${label}</button>`;
}

  document.getElementById('chips-tool').innerHTML=TOOLS.map(t=>mkChip(TOOL_ICON[t]+' '+t,t,fTool===t,TOOL_COLOR[t],'toggleFT')).join('');
  const tags=allTags();

    ?'<span style="font-size:12px;color:#ccc">（タグなし）</span>'
    :tags.map(t=>mkChip(t,t,fTag===t,'#b7860a','toggleFG')).join('');
}
function toggleFC(c){fCat=fCat===c?'':c;renderRecipes();}
function toggleFT(t){fTool=fTool===t?'':t;renderRecipes();}

// ── バックアップ ──
function fmtDateTime(d){
  return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

async function exportRecipes(){
  // 保存日時付きJSON形式（後方互換のため旧形式の配列もimport側で受け付ける）
  const now=new Date();
  const payload={savedAt:now.toISOString(),recipes:recipes};
  const json=JSON.stringify(payload,null,2);
  const file=new File([json],'recipes.json',{type:'application/json'});

  // iPhone/iPad: Web Share APIで共有シートを開く（保存先を毎回選べる）
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'おうちレシピ帳のバックアップ'});
      storageSet('last_backup', now.toISOString(), false);
      showToast(`${recipes.length}件を書き出しました`);
      renderBackupInfo();
      return;
    }catch(err){
      // ユーザーがキャンセル → 何もしない
      if(err && err.name==='AbortError') return;
      // それ以外のエラーは下のダウンロード方式にフォールバック
    }
  }

  // Mac等：通常のダウンロード
  const b=new Blob([json],{type:'application/json'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;
  a.download='recipes.json';
  a.click();URL.revokeObjectURL(u);
  storageSet('last_backup', now.toISOString(), false);
  showToast(`${recipes.length}件を書き出しました`);
  renderBackupInfo();
}

function doImport(list, savedAt){
  recipes=list; persist('r_v4',recipes); renderRecipes();
  // 取り込んだデータの「いつのデータか」を最終バックアップ日時として記録
  if(savedAt) storageSet('last_backup', savedAt, false);
  showToast(`${list.length}件のレシピを復元しました`);
  renderBackupInfo();
}

function importRecipes(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      let list, savedAt=null;
      if(Array.isArray(d)){
        // 旧形式（配列だけ）
        list=d;
      }else if(d && Array.isArray(d.recipes)){
        // 新形式 {savedAt, recipes}
        list=d.recipes;
        savedAt=d.savedAt||null;
      }else{
        throw 0;
      }

      const lastBackup=storageGet('last_backup', false);

      // 日付比較で古いファイルなら警告
      if(savedAt && lastBackup){
        const fileDate=new Date(savedAt);
        const curDate=new Date(lastBackup);
        if(fileDate < curDate){
          const diffDays=Math.floor((curDate-fileDate)/(1000*60*60*24));
          const diffLabel = diffDays===0 ? '同日内（時刻が古い）' : `${diffDays}日前`;
          showConfirm(
            '⚠️ このバックアップは古いです',
            `<div style="background:#fff8e1;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#b7860a">
              ファイルの日付：<b>${fmtDateTime(fileDate)}</b>（${diffLabel}）<br>
              現在のデータ ：<b>${fmtDateTime(curDate)}</b>
            </div>
            <div>読み込むと、現在の<b>${recipes.length}件</b>のレシピが、ファイルの<b>${list.length}件</b>で上書きされます。</div>
            <div style="margin-top:10px;color:#c0392b;font-weight:700">本当に上書きしますか？</div>`,
            '上書きする',
            ()=>doImport(list, savedAt)
          );
          return;
        }
      }

      // 旧形式（日時情報なし）かつ既存データありなら念のため確認
      if(!savedAt && lastBackup){
        showConfirm(
          '📂 バックアップを読み込む',
          `<div style="background:#fff8e1;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#b7860a">
            このファイルには保存日時の情報がありません（旧形式）。新しい形式は書き出し時に自動で付与されます。
          </div>
          <div>現在の<b>${recipes.length}件</b>のレシピが、ファイルの<b>${list.length}件</b>で上書きされます。</div>`,
          '読み込む',
          ()=>doImport(list, null)
        );
        return;
      }

      // 古くない or 初回読み込み → そのまま反映
      doImport(list, savedAt);
    }catch{showToast('ファイルが正しくありません', true);}
  };
  rd.readAsText(f);e.target.value='';
}

// 確認モーダル
function showConfirm(title, bodyHTML, okLabel, onOk){
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-body').innerHTML=bodyHTML;
  const btn=document.getElementById('confirm-ok-btn');
  btn.textContent=okLabel||'続ける';
  btn.onclick=()=>{ closeModal('modal-confirm'); onOk(); };
  openModal('modal-confirm');
}

// 最終バックアップ日時を表示
function renderBackupInfo(){
  const el=document.getElementById('backup-info');
  if(!el) return;
  const last=storageGet('last_backup', false);
  if(!last){
    el.textContent='まだバックアップしていません';
    el.style.color='#c0392b';
    return;
  }
  const d=new Date(last);
  const now=new Date();
  const diffDays=Math.floor((now-d)/(1000*60*60*24));
  const dateStr=`${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  let label='';
  if(diffDays===0) label='（今日）';
  else if(diffDays===1) label='（昨日）';
  else if(diffDays<7) label=`（${diffDays}日前）`;
  else label=`（${diffDays}日前）`;
  el.textContent=`最終バックアップ: ${dateStr} ${label}`;
  el.style.color = diffDays>=7 ? '#c0392b' : '#888';
}

// トースト通知（alert/confirmの代替）
function showToast(msg, isError=false){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText=`position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:${isError?'#c0392b':'#2c2c2c'};color:#fff;padding:10px 20px;border-radius:20px;
    font-size:14px;font-weight:600;z-index:999;white-space:nowrap;pointer-events:none;
    animation:fadeInOut 2.5s ease forwards;`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

// ── モーダル ──
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){
  document.getElementById(id).classList.remove('open');
  if(id==='modal-picker') renderWeekly();
}

// ── 初期化 ──
function init(){
  try{
    renderRecipes();
    renderBackupInfo();
  }catch(e){
    document.body.innerHTML='<div style="padding:20px;font-family:sans-serif"><h2>エラーが発生しました</h2><pre style="background:#fee;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:12px">'+(e&&e.message?e.message:String(e))+'</pre></div>';
  }
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
</script>
